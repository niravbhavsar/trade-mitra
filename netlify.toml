[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/batch"
  to = "/.netlify/functions/batch"
  status = 200

[[redirects]]
  from = "/api/quote/:symbol"
  to = "/.netlify/functions/quote?symbol=:symbol"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

