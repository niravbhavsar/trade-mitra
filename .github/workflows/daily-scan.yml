name: TradeMitra Daily Scanner & Live Cloud Watchdog

on:
  schedule:
    # 1. 04:15 UTC = 09:45 AM IST (Morning 1-Day BTST Exit Alert & Target Check)
    - cron: '15 4 * * 1-5'
    # 2. 06:00 UTC = 11:30 AM IST (Midday Target Watchdog)
    - cron: '0 6 * * 1-5'
    # 3. 07:45 UTC = 01:15 PM IST (Afternoon Target Watchdog)
    - cron: '45 7 * * 1-5'
    # 4. 09:45 UTC = 03:15 PM IST (Prime Daily Action Check + Target Watchdog)
    - cron: '45 9 * * 1-5'
    # 5. 10:30 UTC = 04:00 PM IST (Post-market Close Summary)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r research/requirements.txt

      - name: Run Daily Scanner & Dispatch Telegram Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python research/scanner.py
